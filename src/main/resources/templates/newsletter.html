<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter | marcosaraujo.dev</title>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#121214] text-[#1a1a1a] dark:text-[#e1e1e6] font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-gray-200 dark:selection:bg-gray-800 transition-colors duration-200">

<main class="max-w-md w-full text-center space-y-6">
    <!-- 1. Foto / Avatar -->
    <div class="relative inline-block">
        <a href="/" class="block rounded-full overflow-hidden w-20 h-20 mx-auto ring-4 ring-gray-200 dark:ring-zinc-800 transition-opacity hover:opacity-90">
            <img src="https://github.com/marcosaraujodev083-tech.png"
                 alt="Marcos Araújo"
                 class="w-full h-full object-cover">
        </a>
    </div>

    <!-- 2. Titular e Chamada -->
    <div class="space-y-3">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight text-gray-900 dark:text-zinc-100">
            O essencial da tecnologia, direto ao ponto e sem enrolação.
        </h1>
        <p class="text-sm text-gray-500 dark:text-zinc-400 font-medium">
            Notícias, tendências e insights do mundo tech em leituras rápidas de 3 minutos para quem não tem tempo a perder.
        </p>
    </div>

    <!-- 🟢 MENSAGEM DE SUCESSO -->
    <div th:if="${sucesso}" class="text-sm font-medium p-3 rounded-lg bg-green-50 dark:bg-green-950/50 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-800">
        <span th:text="${sucesso}">Inscrição realizada!</span>
    </div>

    <!-- 🔴 MENSAGEM DE ERRO -->
    <div th:if="${erro}" class="text-sm font-medium p-3 rounded-lg bg-red-50 dark:bg-red-950/50 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800">
        <span th:text="${erro}">Erro ao cadastrar.</span>
    </div>

    <!-- 3. Formulário HTTP POST Nativo -->
    <form th:action="@{/newsletter}" method="post" class="space-y-3 pt-2">
        <div class="relative">
            <input
                    type="email"
                    name="email"
                    required
                    placeholder="Seu e-mail principal"
                    class="w-full px-4 py-3 border border-gray-300 dark:border-zinc-800 rounded-lg text-sm bg-white dark:bg-[#18181b] text-gray-900 dark:text-zinc-100 placeholder-gray-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
            />
        </div>

        <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/30 transition duration-200 flex items-center justify-center gap-2"
        >
            <span>Inscrever-se (Grátis)</span>
        </button>
    </form>

    <!-- Link para voltar ao blog -->
    <div class="pt-4">
        <a href="/" class="text-xs font-mono text-gray-400 dark:text-zinc-500 hover:text-black dark:hover:text-white hover:underline transition">
            ← Voltar para marcosaraujo.dev
        </a>
    </div>
</main>

</body>
</html>
