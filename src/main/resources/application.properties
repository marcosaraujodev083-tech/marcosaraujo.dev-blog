# Porta do Site Público
server.port=8081

# Nome da sua aplicação pública
spring.application.name=blog-publico

# Conexão com o Supabase apontando para o .env
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Apenas validação do schema, sem alterar o banco!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect