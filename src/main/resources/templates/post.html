<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' — marcosaraujo.dev'">Artigo — marcosaraujo.dev</title>
    <!-- Script unificado do Tailwind CSS com o plugin Typography -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
</head>
<body class="bg-[#f8f9fa] text-[#1a1a1a] font-sans antialiased max-w-xl mx-auto px-4 py-8 selection:bg-gray-200">

<!-- Header Estruturado com Avatar e Identidade Visual Padronizada -->
<header class="border-b border-gray-200 pb-5 mb-8 flex justify-between items-center">

    <!-- Foto + Nome e Nav -->
    <div class="flex items-center space-x-3.5">
        <a href="/" class="shrink-0 hover:opacity-90 transition block rounded-full overflow-hidden w-12 h-12">
            <img src="https://github.com/marcosaraujodev083-tech.png"
                 alt="Marcos Araújo"
                 class="w-full h-full object-cover">
        </a>

        <div>
            <a href="/" class="text-xl font-bold tracking-tight hover:opacity-80 transition block leading-tight">
                marcosaraujo.dev
            </a>
            <nav class="flex items-center space-x-2 text-[11px] font-mono text-gray-500 mt-1">
                <span>Notes & News</span>
                <span>•</span>
                <a href="https://github.com/marcosaraujodev083-tech"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="hover:text-black hover:underline transition">
                    GitHub
                </a>
                <span>•</span>
                <a href="/contato"
                   class="hover:text-black hover:underline transition">
                    Contato
                </a>
            </nav>
        </div>
    </div>

    <!-- Versão à Direita -->
    <div class="text-[11px] text-gray-400 font-mono hidden sm:block">
        <span>v1.0</span>
    </div>

</header>

<!-- Botão / Link para Voltar -->
<nav class="mb-6">
    <a href="/" class="text-[11px] font-mono text-gray-500 hover:text-black transition flex items-center space-x-1">
        <span>← Voltar para todos os artigos</span>
    </a>
</nav>

<!-- Cabeçalho do Artigo -->
<section class="mb-6 border-b border-gray-200 pb-5">
    <h1 class="text-2xl font-extrabold tracking-tight text-gray-900 leading-tight" th:text="${post.title}">
        Título do Artigo
    </h1>

    <div class="text-[11px] font-mono text-gray-400 mt-3 flex items-center space-x-2">
        <span>Por Marcos Araújo</span>
        <span>•</span>
        <time th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy - HH:mm')}">30/07/2026 - 14:00</time>
        <span>•</span>
        <span th:text="${post.tags}" class="text-gray-500 uppercase tracking-wider text-[9px]">java, security</span>
    </div>
</section>

<!-- Conteúdo do Artigo (Markdown convertido em HTML) -->
<main class="prose prose-neutral prose-sm max-w-none prose-headings:font-bold prose-a:text-blue-600 prose-img:rounded-lg">
    <div th:utext="${contentHtml}">
        <p>Conteúdo do artigo em HTML renderizado aqui...</p>
    </div>
</main>

<!-- Footer -->
<footer class="mt-12 pt-5 border-t border-gray-200 flex justify-between items-center text-[11px] text-gray-400 font-mono">
    <a href="/" class="hover:text-black transition">← Voltar à lista</a>
    <span>marcosaraujo.dev</span>
</footer>

</body>
</html>
